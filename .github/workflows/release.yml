name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  release-notes:
    name: Generate Release Notes
    runs-on: ubuntu-latest
    steps:
      - uses: lhuasheng/shared-sdlc/actions/release-notes-router@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          agentic-workflow-repo: lhuasheng/shared-agentic
          agentic-workflow-ref: main
