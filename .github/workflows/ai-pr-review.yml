name: AI PR Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  ai-review:
    name: AI PR Review
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/ai-review')
    runs-on: ubuntu-latest
    steps:
      - uses: lhuasheng/shared-sdlc/actions/ai-pr-review@main
        with:
          github-token: ${{ secrets.AGENTIC_DISPATCH_TOKEN }}
          agentic-workflow-repo: lhuasheng/shared-agentic
          agentic-workflow-ref: main
